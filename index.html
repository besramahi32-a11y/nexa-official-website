<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa Earning - Official App</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.15);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .logo { font-size: 60px; margin-bottom: 20px; }
        h1 { font-size: 32px; margin-bottom: 15px; }
        p { margin: 10px 0; line-height: 1.5; }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
        }
        .contact-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        .email { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💎</div>
        <h1>Nexa Earning</h1>
        <p>Your Gateway to Smart Earnings</p>
        <p>Start your earning journey with our trusted platform</p>
        <button class="btn">Get Started Now</button>
        <div class="contact-info">
            <p>Contact us: <span class="email">nexaearning@gmail.com</span></p>
        </div>
    </div>
</body>
</html>
